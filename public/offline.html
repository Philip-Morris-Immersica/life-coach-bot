<!doctype html>
<html lang="bg">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Няма връзка · Life Coach</title>
    <style>
      :root { --bg: #f6f3ee; --fg: #1f2a27; --muted: #5d6b66; --accent: #2f6f5e; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #0f1513; --fg: #e8efec; --muted: #9db0a8; --accent: #6fcf9f; }
      }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid; place-items: center; padding: 24px; text-align: center;
        background: var(--bg); color: var(--fg);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main { max-width: 360px; }
      h1 { font-size: 1.4rem; margin: 0 0 8px; }
      p { color: var(--muted); line-height: 1.5; margin: 0 0 20px; }
      button {
        background: var(--accent); color: var(--bg); border: 0; border-radius: 12px;
        padding: 12px 20px; font-size: 1rem; font-weight: 600; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Няма връзка</h1>
      <p>Коучът има нужда от интернет, за да отговаря. Провери връзката си и опитай отново.</p>
      <button onclick="location.reload()">Опитай пак</button>
    </main>
  </body>
</html>
